[package]
name = "toonforge"
version = "0.1.0"
description = "Open-source ToonForge desktop studio for vertical 2D-in-3D educational cartoon shorts"
license = "MIT"
edition = "2021"

[lib]
name = "toonforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
tokio = { version = "1", features = ["process", "sync", "time", "rt-multi-thread"] }
